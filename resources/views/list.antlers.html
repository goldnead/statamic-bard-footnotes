<section class="footnotes" aria-labelledby="footnotes-title">
    <h2 id="footnotes-title">{{ trans key="bard-footnotes::messages.title" }}</h2>
    <ol>
    {{ sources }}
        <li id="fn-{{ number }}">
            {{ if url }}
                <a href="{{ url | entities }}" target="_blank" rel="noopener noreferrer">{{ text | entities }}</a>
            {{ else }}
                {{ text | entities }}
            {{ /if }}
            <a href="#fnref-{{ number }}" class="footnote-back" aria-label="{{ trans key="bard-footnotes::messages.back" :number="number" }}">↩</a>
        </li>
    {{ /sources }}
    </ol>
</section>
