<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #1E293B 0%, #0F172A 55%, #020617 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #C7D2FE; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #818CF8; box-shadow: 0 0 18px #818CF8; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#C7D2FE,#A5B4FC); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #C7D2FE; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #818CF847, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Bard Footnotes</span></h1>
      <p class="sub">Type [1] in the text, keep the sources in a grid, get superscript links and a source list.</p>
      <div class="badges">
        <span class="badge">Superscript links</span>
        <span class="badge">One source grid</span>
        <span class="badge">MIT</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4F46E5"/><stop offset="1" stop-color="#312E81"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- Two text lines with a raised superscript 1, and the numbered
             rows of the source list in a dashed box. -->
        <rect x="104" y="112" width="190" height="30" rx="15" fill="#FFFFFF"/>
        <path d="M318 100 L336 84 H348 V136 H334 V100 Z" fill="#FFFFFF"/>
        <rect x="104" y="170" width="136" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.75"/>
        <rect x="104" y="244" width="304" height="164" rx="30" fill="#FFFFFF" fill-opacity="0.14"
              stroke="#FFFFFF" stroke-width="14" stroke-dasharray="36 22" stroke-linecap="round"/>
        <rect x="144" y="288" width="34" height="26" rx="10" fill="#FFFFFF"/>
        <rect x="194" y="288" width="120" height="26" rx="13" fill="#FFFFFF"/>
        <rect x="144" y="332" width="34" height="26" rx="10" fill="#FFFFFF" fill-opacity="0.78"/>
        <rect x="194" y="332" width="96" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.78"/>
        <rect x="144" y="376" width="34" height="26" rx="10" fill="#FFFFFF" fill-opacity="0.58"/>
        <rect x="194" y="376" width="72" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.58"/>
      </svg>
    </div>
  </div>
</body>
</html>
