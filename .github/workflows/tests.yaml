name: Test Suite

on:
  push:
    branches: [main, '*.x']
  pull_request:

permissions: {}

jobs:
  php_tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
        stability: [prefer-stable, prefer-lowest]

        # No Statamic axis and no Laravel axis: Statamic 6 requires Laravel
        # 12, so there is exactly one installable Laravel major for the
        # range this package declares. The prefer-lowest legs verify the
        # floor of `^6.0` instead.

    name: PHP ${{ matrix.php }} · Statamic 6 · ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "statamic/cms:6.*" "orchestra/testbench:10.*" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run PHPUnit
        run: composer test

  lint:
    runs-on: ubuntu-latest
    name: Code style

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      # Check, never fix. Auto-committing style fixes onto a contributor's branch
      # rewrites their work without asking.
      - run: vendor/bin/pint --test

  static_analysis:
    runs-on: ubuntu-latest
    name: Static analysis

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - run: vendor/bin/phpstan analyse --no-progress

  assets:
    runs-on: ubuntu-latest
    name: Committed dist is current

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - run: composer install --prefer-dist --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The compiled bundle in dist/ is committed; consumers never run a
      # Node build. This job fails when the sources changed without a
      # rebuild, so what ships always matches what is in the repo.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- dist
